<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiClaude</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #1f1e1c; --muted: #6b6860; --line: #e4e1da;
    --accent: #c15f3c; --ok: #2f7d4f; --warn: #b7791f; --bad: #b23b3b; --code: #f0eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1918; --panel: #232220; --ink: #ecebe7; --muted: #9c998f; --line: #37352f;
      --accent: #e08a63; --ok: #5fbf85; --warn: #e0b04f; --bad: #e57373; --code: #2c2b28; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; background: var(--panel); }
  main { display: flex; flex-direction: column; min-width: 0; }
  h1 { font-size: 18px; margin: 0 0 4px; } h1 span { color: var(--accent); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
  .sub { color: var(--muted); font-size: 12px; }
  .acct { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .acct.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .acct .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .acct b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .ready { color: var(--ok); } .limited { color: var(--warn); } .disabled { color: var(--bad); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  .row { display: flex; gap: 6px; }
  #log { flex: 1; overflow-y: auto; padding: 20px max(20px, calc((100% - 820px) / 2)); }
  .msg { margin: 0 0 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .msg.tool { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .msg.sys { font-size: 12px; color: var(--warn); }
  .msg.err { font-size: 12px; color: var(--bad); }
  form.chat { border-top: 1px solid var(--line); padding: 12px max(20px, calc((100% - 820px) / 2)); display: flex; gap: 8px; background: var(--panel); }
  form.chat textarea { resize: none; height: 60px; }
  #wait { display: none; padding: 8px 20px; background: var(--code); color: var(--warn); font-size: 13px; border-top: 1px solid var(--line); }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; height: auto; } aside { border-right: 0; border-bottom: 1px solid var(--line); } main { height: 90vh; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Multi<span>Claude</span></h1>
    <div class="sub" id="meta">connecting…</div>

    <h2>Accounts</h2>
    <div id="accounts"></div>
    <details>
      <summary style="cursor:pointer">Add account</summary>
      <form id="add">
        <label>Name</label><input name="name" required placeholder="work-max">
        <label>Type</label>
        <select name="type" id="atype"></select>
        <div id="secretRow"><label>API key / token</label><input name="secret" type="password" autocomplete="off"></div>
        <div class="acts"><button class="primary">Add</button></div>
      </form>
    </details>

    <h2>Rotation</h2>
    <form id="settings">
      <label>Strategy</label><select name="strategy" id="strategy"></select>
      <label>When every account is limited</label>
      <select name="onAllLimited"><option value="wait">Wait for the first reset, then continue</option><option value="stop">Stop and report</option></select>
      <label>Switch early at window utilization (0–1, 1 = never)</label><input name="switchAtUtilization" type="number" min="0" max="1" step="0.01">
      <label>Cooldown when no reset time is given (minutes)</label><input name="defaultCooldownMinutes" type="number" min="1">
      <label>Model (blank = Claude Code default)</label><input name="model" placeholder="e.g. opus, sonnet">
      <label>Permission mode</label>
      <select name="permissionMode">
        <option value="default">default (asks; denied in background turns)</option>
        <option value="acceptEdits">acceptEdits</option>
        <option value="plan">plan (read-only)</option>
        <option value="bypassPermissions">bypassPermissions (full terminal access)</option>
      </select>
      <div class="acts"><button class="primary">Save</button></div>
    </form>

    <h2>Memory</h2>
    <div class="sub" id="mempath"></div>
    <textarea id="memory" rows="8" style="font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea>
    <div class="acts"><button id="saveMem">Save memory</button></div>
  </aside>

  <main>
    <div id="log"></div>
    <div id="wait"></div>
    <form class="chat" id="chat">
      <textarea id="prompt" placeholder="Message Claude…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="primary" id="sendBtn">Send</button>
        <button type="button" id="stopBtn">Stop</button>
        <button type="button" id="newBtn">New</button>
      </div>
    </form>
  </main>
</div>

<script>
const hashToken = new URLSearchParams(location.hash.slice(1)).get('token');
let token = hashToken;
try { if (hashToken) sessionStorage.setItem('mc-token', hashToken); else token = sessionStorage.getItem('mc-token'); } catch {}
if (hashToken) history.replaceState(null, '', location.pathname);

const $ = (s) => document.querySelector(s);
const api = async (method, url, data) => {
  const r = await fetch(url, { method, headers: { 'x-token': token || '', 'content-type': 'application/json' }, body: data ? JSON.stringify(data) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dur = (ms) => { const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };

let state = null, current = null;
const log = $('#log');
function add(cls, text) {
  const el = document.createElement('div'); el.className = 'msg ' + cls; el.textContent = text;
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.appendChild(el); if (stick) log.scrollTop = log.scrollHeight; return el;
}

function render() {
  const s = state;
  $('#meta').textContent = `${s.accounts.length} account(s) · ${s.busy ? 'working…' : 'idle'} · ${s.cwd}`;
  $('#accounts').innerHTML = s.accounts.map((a) => `
    <div class="acct ${a.active ? 'active' : ''}">
      <div class="top"><b title="${esc(a.id)}">${esc(a.name)}</b>
        <span class="pill ${a.status}">${a.status === 'limited' ? 'resets in ' + dur(a.limitedUntil - Date.now()) : a.status}</span></div>
      <div class="sub">${esc(a.type)} ${esc(a.secret)} · ${a.turns} turns${a.costUsd ? ' · $' + a.costUsd.toFixed(2) : ''}</div>
      ${Object.entries(a.windows).map(([k, w]) => `<div class="sub">${esc(k.replace('_', ' '))} ${Math.round((w.utilization || 0) * 100)}%</div><div class="bar"><i style="width:${Math.min(100, (w.utilization || 0) * 100)}%"></i></div>`).join('')}
      ${a.lastError && a.status !== 'ready' ? `<div class="sub">${esc(a.lastError)}</div>` : ''}
      <div class="acts">
        ${a.active ? '' : `<button data-a="use" data-id="${esc(a.id)}">Use</button>`}
        ${a.status === 'limited' ? `<button data-a="reset" data-id="${esc(a.id)}">Clear limit</button>` : ''}
        <button data-a="${a.enabled ? 'disable' : 'enable'}" data-id="${esc(a.id)}">${a.enabled ? 'Disable' : 'Enable'}</button>
        <button data-a="remove" data-id="${esc(a.id)}">Remove</button>
      </div>
      ${a.type === 'login' ? `<div class="sub">Sign in from a terminal: <code>multiclaude login ${esc(a.id)}</code></div>` : ''}
    </div>`).join('') || '<div class="sub">No accounts yet — add one below.</div>';
  const f = $('#settings');
  if (!f.contains(document.activeElement)) for (const [k, v] of Object.entries(s.settings)) if (f.elements[k]) f.elements[k].value = v ?? '';
  $('#sendBtn').disabled = s.busy;
}

async function refresh() { try { state = await api('GET', '/api/state'); render(); } catch (e) { $('#meta').textContent = e.message + ' — open the link printed by `multiclaude web`.'; } }

async function init() {
  await refresh();
  if (!state) return;
  $('#strategy').innerHTML = Object.entries(state.strategies).map(([k, v]) => `<option value="${k}">${k} — ${esc(v)}</option>`).join('');
  $('#atype').innerHTML = Object.entries(state.accountTypes).map(([k, v]) => `<option value="${k}">${k} — ${esc(v)}</option>`).join('');
  render();
  const m = await api('GET', '/api/memory'); $('#memory').value = m.text; $('#mempath').textContent = m.path;

  const es = new EventSource('/api/events?token=' + encodeURIComponent(token));
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type !== 'text') current = null;
    if (ev.type === 'waiting') { $('#wait').style.display = 'block'; $('#wait').textContent = `⏳ All accounts are limited — resuming in ${dur(ev.msLeft)} (${new Date(ev.until).toLocaleTimeString()})`; return; }
    $('#wait').style.display = 'none';
    switch (ev.type) {
      case 'reset': log.innerHTML = ''; break;
      case 'user': add('user', ev.text); break;
      case 'text': if (!current) current = add('assistant', ''); current.textContent += ev.text; log.scrollTop = log.scrollHeight; break;
      case 'tool': add('tool', `${ev.subagent ? '  ↳ ' : '⚙ '}${ev.name}${ev.input && (ev.input.command || ev.input.file_path || ev.input.pattern || ev.input.description) ? ': ' + String(ev.input.command || ev.input.file_path || ev.input.pattern || ev.input.description).split('\n')[0].slice(0, 140) : ''}`); break;
      case 'account': add('sys', `[${ev.account.name}]`); refresh(); break;
      case 'switch': add('sys', `↻ switched to "${ev.to.name}"`); refresh(); break;
      case 'limited': add('sys', `⚠ "${ev.account.name}": ${ev.message} — resets ${new Date(ev.until).toLocaleString()}`); refresh(); break;
      case 'retry': add('sys', `API overloaded, retry ${ev.attempt} in ${dur(ev.delayMs)}`); break;
      case 'notice': add('err', ev.message); refresh(); break;
      case 'done': if (ev.error) add('err', ev.error); refresh(); break;
    }
  };
  setInterval(refresh, 15000);
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  try {
    if (b.dataset.a === 'remove') { if (!confirm('Remove this account?')) return; await api('DELETE', '/api/accounts/' + b.dataset.id); }
    else await api('POST', `/api/accounts/${b.dataset.id}/${b.dataset.a}`);
    refresh();
  } catch (err) { alert(err.message); }
});
$('#atype').addEventListener('change', (e) => { $('#secretRow').style.display = e.target.value === 'login' ? 'none' : ''; });
$('#add').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target;
  try { const r = await api('POST', '/api/accounts', { name: f.elements.name.value, type: f.elements.type.value, secret: f.elements.secret.value }); f.reset(); if (r.note) alert(r.note); refresh(); }
  catch (err) { alert(err.message); }
});
$('#settings').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { state = await api('POST', '/api/settings', Object.fromEntries(new FormData(e.target))); render(); } catch (err) { alert(err.message); }
});
$('#saveMem').addEventListener('click', () => api('POST', '/api/memory', { text: $('#memory').value }).catch((err) => alert(err.message)));
$('#chat').addEventListener('submit', async (e) => {
  e.preventDefault(); const p = $('#prompt').value.trim(); if (!p) return;
  try { await api('POST', '/api/chat', { prompt: p }); $('#prompt').value = ''; refresh(); } catch (err) { add('err', err.message); }
});
$('#prompt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#chat').requestSubmit(); } });
$('#stopBtn').addEventListener('click', () => api('POST', '/api/stop'));
$('#newBtn').addEventListener('click', () => api('POST', '/api/new').catch((err) => alert(err.message)));
init();
</script>
</body>
</html>
