<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiClaude</title>
<style>
  :root {
    --bg: #262624; --side: #1f1e1d; --panel: #30302e; --panel2: #3a3936; --ink: #f5f4ef; --ink2: #c3c0b6;
    --muted: #8f8c83; --line: #3e3d39; --line2: #4a4944; --accent: #d97757; --accent-ink: #fff;
    --ok: #7fb685; --warn: #e3b35b; --bad: #e57368; --add: rgba(94, 170, 110, .16); --del: rgba(229, 115, 104, .16);
    --code: #1c1b1a; --shadow: 0 8px 30px rgba(0, 0, 0, .35);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #faf9f5; --side: #f3f1ea; --panel: #ffffff; --panel2: #f0eee6; --ink: #1f1e1c; --ink2: #3d3a34;
      --muted: #7a766c; --line: #e6e2d8; --line2: #d6d1c4; --accent: #c6613f; --ok: #3c7a47; --warn: #9a6a12;
      --bad: #b8433a; --add: rgba(60, 140, 80, .12); --del: rgba(200, 70, 60, .12); --code: #f5f3ec; --shadow: 0 8px 30px rgba(0, 0, 0, .12);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  code, pre { font-family: var(--mono); font-size: 13px; }
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  .app.collapsed { grid-template-columns: 0 1fr; }
  .app.collapsed aside { visibility: hidden; }

  /* sidebar */
  aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; font-weight: 600; font-size: 17px; }
  .brand svg { color: var(--accent); flex: none; }
  .nav { padding: 0 8px; display: flex; flex-direction: column; gap: 2px; }
  .nav-btn { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink2); font-size: 14px; width: 100%; text-align: left; }
  .nav-btn:hover { background: var(--panel); color: var(--ink); }
  .search { margin: 6px 8px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
  .search input { background: none; border: 0; outline: 0; width: 100%; font-size: 14px; }
  .section { font-size: 12px; color: var(--muted); padding: 14px 18px 6px; }
  .recents { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .recent { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: 14px; color: var(--ink2); cursor: pointer; }
  .recent:hover { background: var(--panel); }
  .recent.on { background: var(--panel2); color: var(--ink); }
  .recent .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .recent .x { opacity: 0; color: var(--muted); padding: 0 2px; }
  .recent:hover .x { opacity: 1; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line2); flex: none; }
  .dot.busy { background: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .twist { display: flex; align-items: center; gap: 3px; color: var(--muted); padding: 0 2px; }
  .twist svg { transition: transform .15s; }
  .twist.open svg { transform: rotate(90deg); }
  .count { font-size: 11px; background: var(--panel2); border-radius: 99px; padding: 0 6px; }
  .count.busy { background: var(--accent); color: var(--accent-ink); }
  .subs { margin: 0 0 4px 17px; border-left: 1px solid var(--line2); padding-left: 6px; }
  .sub { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .sub:hover { background: var(--panel); color: var(--ink2); }
  .sub.on { background: var(--panel2); color: var(--ink); }
  .sub .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sub .x { opacity: 0; color: var(--muted); padding: 0 4px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
  .sub:hover .x, .sub .x.armed { opacity: 1; }
  .sub .x:hover { color: var(--bad); }
  .sub .x.armed { color: #fff; background: var(--bad); }
  @media (hover: none) { .sub .x { opacity: .7; } }
  .dot.bad { background: var(--bad); }
  .foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .foot:hover { background: var(--panel); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; }
  .foot .who { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
  .foot .who b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot .who span { color: var(--muted); font-size: 12px; }

  /* main */
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 48px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--panel); color: var(--ink); }
  .title { font-size: 14px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: text; }
  .chip { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  .spacer { flex: 1; }
  #scroll { flex: 1; overflow-y: auto; }
  .col { max-width: 760px; margin: 0 auto; padding: 8px 24px 24px; }
  .empty { max-width: 760px; margin: 18vh auto 0; padding: 0 24px; text-align: center; }
  .empty h2 { font-family: ui-serif, Georgia, serif; font-weight: 400; font-size: 32px; margin: 0 0 8px; }
  .empty p { color: var(--muted); margin: 0; }

  .msg-user { display: flex; justify-content: flex-end; margin: 18px 0; }
  .msg-user div { background: var(--panel2); border-radius: 14px; padding: 10px 14px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
  .md { margin: 10px 0; word-wrap: break-word; }
  .md p { margin: 0 0 10px; } .md p:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 16px 0 8px; line-height: 1.3; } .md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3, .md h4 { font-size: 16px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md a { color: var(--accent); }
  .md :not(pre) > code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  .md pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0 0 10px; }
  .md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line2); color: var(--ink2); }
  .md table { border-collapse: collapse; margin: 0 0 10px; font-size: 14px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

  .tool { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; background: var(--panel); overflow: hidden; }
  .tool > .head { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 13.5px; cursor: pointer; user-select: none; }
  .tool > .head:hover { background: var(--panel2); }
  .tool .st { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .tool.running .st { background: var(--accent); animation: pulse 1.2s infinite; }
  .tool.ok .st { background: var(--ok); }
  .tool.err .st { background: var(--bad); }
  .tool .name { font-weight: 600; flex: none; }
  .tool .arg { font-family: var(--mono); font-size: 12.5px; color: var(--ink2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .tool .open-sub { padding: 1px 10px; font-size: 12px; flex: none; }
  .tool .chev { color: var(--muted); transition: transform .15s; flex: none; }
  .tool.open > .head .chev { transform: rotate(90deg); }
  .tool > .body { display: none; border-top: 1px solid var(--line); }
  .tool.open > .body { display: block; }
  .tool pre.out { margin: 0; padding: 10px 12px; max-height: 360px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: var(--code); font-size: 12.5px; color: var(--ink2); }
  .tool.err pre.out { color: var(--bad); }
  .diff { font-family: var(--mono); font-size: 12.5px; background: var(--code); max-height: 360px; overflow: auto; padding: 6px 0; }
  .diff div { padding: 0 12px; white-space: pre-wrap; word-break: break-word; }
  .diff .a { background: var(--add); } .diff .d { background: var(--del); }
  .agent > .head .name { color: var(--accent); }
  .agent .children { padding: 4px 10px 8px 22px; border-top: 1px dashed var(--line); }
  .agent .children:empty { display: none; }
  .agent .children .tool { margin: 4px 0; background: var(--bg); }
  .todos { list-style: none; margin: 0; padding: 8px 14px; font-size: 13.5px; }
  .todos li { display: flex; gap: 8px; align-items: baseline; }
  .todos .done { color: var(--muted); text-decoration: line-through; }
  .todos .doing { color: var(--accent); font-weight: 500; }

  .perm { border: 1px solid var(--accent); border-radius: 10px; margin: 10px 0; padding: 10px 12px; background: var(--panel); }
  .perm.answered { border-color: var(--line); }
  .perm .q { font-size: 14px; margin-bottom: 4px; word-break: break-word; }
  .perm .q code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .perm .diff { margin: 6px 0; border-radius: 6px; max-height: 200px; }
  .msg-user { flex-direction: column; align-items: flex-end; }
  .msg-user .meta { margin-top: 3px; }
  .working.idle { color: var(--muted); }
  .working.idle svg { animation: none; }
  .subbar { max-width: 760px; margin: 0 auto; width: 100%; padding: 6px 24px; display: flex; align-items: center; gap: 10px; }
  .subbar .subtitle { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
  .subbar .subtitle b { font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #slashMenu { position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 6px; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; z-index: 5; }
  #slashMenu div { display: flex; gap: 12px; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #slashMenu div.on, #slashMenu div:hover { background: var(--panel2); }
  #slashMenu b { font-family: var(--mono); font-weight: 500; font-size: 13px; min-width: 80px; }
  #slashMenu span { color: var(--muted); }
  .composer-inner { position: relative; }
  .conv { padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .conv:hover { background: var(--panel); }
  .conv .t { font-size: 14.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .conv .meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .note { font-size: 12.5px; color: var(--muted); margin: 10px 0; display: flex; align-items: center; gap: 8px; }
  .note::before, .note::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .error { font-size: 13.5px; color: var(--bad); margin: 10px 0; }
  .working { display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 14px; margin: 12px 0; }
  .working svg { animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* composer */
  .composer-wrap { padding: 0 24px 16px; }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  .status { font-size: 13px; color: var(--warn); background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; padding: 7px 14px; display: none; margin: 0 10px; }
  .composer { background: var(--panel); border: 1px solid var(--line2); border-radius: 16px; padding: 10px 12px 8px; box-shadow: var(--shadow); }
  .composer:focus-within { border-color: var(--muted); }
  .composer textarea { width: 100%; background: none; border: 0; outline: 0; resize: none; min-height: 26px; max-height: 240px; line-height: 1.5; padding: 2px 4px; }
  .composer textarea::placeholder { color: var(--muted); }
  .bar { display: flex; align-items: center; gap: 4px; margin-top: 6px; min-width: 0; }
  .pick { position: relative; min-width: 0; }
  .pick select { max-width: 100%; text-overflow: ellipsis; }
  .pick select { appearance: none; background: none; border: 0; border-radius: 8px; padding: 4px 8px; font-size: 13px; color: var(--ink2); cursor: pointer; }
  .pick select:hover { background: var(--panel2); color: var(--ink); }
  .pick select option { background: var(--panel); color: var(--ink); }
  .send { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
  .send:disabled { opacity: .4; cursor: default; }
  .send.stop { background: var(--ink); color: var(--bg); }
  .hint { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  /* modal */
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal.on { display: flex; }
  .card { background: var(--bg); border: 1px solid var(--line2); border-radius: 14px; width: min(720px, 100%); max-height: 88vh; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .card header { display: flex; align-items: center; gap: 4px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .card header h3 { margin: 0 12px 0 0; font-size: 16px; }
  .tab { padding: 5px 12px; border-radius: 8px; font-size: 14px; color: var(--muted); }
  .tab.on { background: var(--panel2); color: var(--ink); }
  .card .content { padding: 16px; overflow-y: auto; }
  .acct { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); }
  .acct.active { border-color: var(--accent); }
  .acct .row1 { display: flex; align-items: center; gap: 8px; }
  .acct .row1 b { flex: 1; font-weight: 500; }
  .pill { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .pill.ready { color: var(--ok); } .pill.limited { color: var(--warn); } .pill.disabled { color: var(--bad); }
  .meta { font-size: 12.5px; color: var(--muted); }
  .meter { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 3px 0 6px; }
  .meter i { display: block; height: 100%; background: var(--accent); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .btn { border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
  .btn:hover { background: var(--panel2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; }
  .in { width: 100%; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; outline: 0; }
  .in:focus { border-color: var(--muted); }
  textarea.in { font-family: var(--mono); font-size: 12.5px; min-height: 280px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 14px; }
  .dirs { border: 1px solid var(--line); border-radius: 8px; max-height: 280px; overflow-y: auto; margin-top: 8px; }
  .dirs div { padding: 5px 12px; font-size: 14px; cursor: pointer; display: flex; gap: 8px; }
  .dirs div:hover { background: var(--panel); }
  .banner { max-width: 760px; margin: 12px auto 0; padding: 10px 14px; border: 1px solid var(--warn); border-radius: 10px; color: var(--ink); background: var(--panel); font-size: 14px; }
  .banner code { background: var(--code); padding: 1px 6px; border-radius: 4px; user-select: all; }
  .warn-box { font-size: 13px; color: var(--ink2); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-top: 12px; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 0 1fr; }
    .app.mobile-open { grid-template-columns: 260px 1fr; }
    .app:not(.mobile-open) aside { visibility: hidden; }
    .col, .composer-wrap { padding-left: 16px; padding-right: 16px; }
    .grid2 { grid-template-columns: 1fr; }
    .pick select { padding: 4px 4px; font-size: 12.5px; }
    .chip { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 6l-4.2 5 6.2 1-6.2 1.8L20 18l-6.2-2.2L12 22l-1.8-6.2L4 18l4.2-4.2L2 12l6.2-1L4 6l6.2 2.2z"/></svg>
      MultiClaude
    </div>
    <div class="nav">
      <button class="nav-btn" id="newBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New session</button>
      <button class="nav-btn" id="resumeBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Resume…</button>
      <button class="nav-btn" id="acctBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M1 21c0-4 4-6 8-6s8 2 8 6M17 4a4 4 0 0 1 0 8M23 21c0-3-2-5-5-6"/></svg>Accounts</button>
      <button class="nav-btn" id="memBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h5"/></svg>Memory</button>
    </div>
    <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><input id="search" placeholder="Search"></div>
    <div class="section">Recents</div>
    <div class="recents" id="recents"></div>
    <div class="foot" id="foot">
      <div class="avatar" id="footAvatar">·</div>
      <div class="who"><b id="footName">No accounts</b><span id="footMeta">Add one to start</span></div>
    </div>
  </aside>

  <main>
    <div class="top">
      <button class="icon-btn" id="toggleSide" title="Toggle sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <div class="title" id="title" title="Click to rename"></div>
      <div class="chip" id="cwdChip" hidden></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="delBtn" title="Delete session" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="subbar" id="subbar" hidden></div>
    <div id="scroll"><div class="col" id="chat"></div></div>
    <div class="composer-wrap">
      <div class="composer-inner">
        <div id="slashMenu" hidden></div>
        <div class="status" id="status"></div>
        <form class="composer" id="composer">
          <textarea id="prompt" rows="1" placeholder="Ask Claude to build, fix or explain anything…"></textarea>
          <div class="bar">
            <div class="pick"><select id="permSel" title="Permission mode">
              <option value="default">Ask before acting</option>
              <option value="acceptEdits">Accept edits</option>
              <option value="auto">Auto</option>
              <option value="plan">Plan mode</option>
              <option value="bypassPermissions">Bypass permissions</option>
            </select></div>
            <div class="spacer"></div>
            <div class="pick"><select id="modelSel" title="Model">
              <option value="">Default model</option>
              <optgroup label="Latest of each">
                <option value="opus">Opus (latest)</option>
                <option value="sonnet">Sonnet (latest)</option>
                <option value="fable">Fable (latest)</option>
                <option value="haiku">Haiku (latest)</option>
              </optgroup>
              <optgroup label="Opus">
                <option value="claude-opus-5-5">Opus 5.5</option>
                <option value="claude-opus-5">Opus 5</option>
                <option value="claude-opus-4-8">Opus 4.8</option>
                <option value="claude-opus-4-7">Opus 4.7</option>
                <option value="claude-opus-4-6">Opus 4.6</option>
              </optgroup>
              <optgroup label="Sonnet">

<script>
/* ---------- plumbing ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dur = (ms) => { const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('mc.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mc.' + k, JSON.stringify(v)); } catch {} },
};

const hashToken = new URLSearchParams(location.hash.slice(1)).get('token');
let token = hashToken;
try { if (hashToken) sessionStorage.setItem('mc-token', hashToken); else token = sessionStorage.getItem('mc-token'); } catch {}
if (hashToken) history.replaceState(null, '', location.pathname + location.search);

async function api(method, url, data) {
  const r = await fetch(url, { method, headers: { 'x-token': token || '', 'content-type': 'application/json' }, body: data ? JSON.stringify(data) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

/* ---------- markdown ---------- */
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}
function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let html = '', i = 0, para = [];
  const flush = () => { if (para.length) { html += `<p>${inline(para.join('\n')).replace(/\n/g, '<br>')}</p>`; para = []; } };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^\s*```(\S*)/))) {
      flush(); const buf = []; i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++; html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue;
    }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flush(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { flush(); html += '<hr>'; i++; continue; }
    if (/^\s*>/.test(l)) { flush(); const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, '')); html += `<blockquote>${markdown(buf.join('\n'))}</blockquote>`; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?[\s:-]+\|/.test(lines[i + 1] || '')) {
      flush(); const row = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const head = row(l); i += 2; let t = `<table><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr>`;
      while (i < lines.length && /^\s*\|/.test(lines[i])) t += `<tr>${row(lines[i++]).map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`;
      html += t + '</table>'; continue;
    }
    if ((m = l.match(/^(\s*)([-*+]|\d+[.)])\s+/))) {
      flush(); const ordered = /\d/.test(m[2]); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item += '\n' + lines[i++].trim();
        items.push(item);
      }
      html += `<${ordered ? 'ol' : 'ul'}>${items.map((x) => `<li>${inline(x)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`; continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l); i++;
  }
  flush();
  return html;
}

/* ---------- state ---------- */
let state = null;
let currentId = store.get('session', null);
let currentSub = null; // subagent tool-use id when viewing a subagent's conversation
let es = null;
let busy = false;
let waitTimer = null;
let bgTasks = 0;
const chat = $('#chat');
const scroller = $('#scroll');

function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; }
function toBottom(force) { if (force || stick) scroller.scrollTop = scroller.scrollHeight; }
let stick = true;
scroller.addEventListener('scroll', () => { stick = nearBottom(); });

async function refresh() {
  try { state = await api('GET', '/api/state'); }
  catch (e) { chat.innerHTML = `<div class="empty"><h2>Can't connect</h2><p>${esc(e.message)}. Open the link printed by <code>multiclaude web</code>.</p></div>`; return; }
  renderSidebar();
  renderSettings();
  renderTop();
  const b = $('#banner');
  if (!state.claude.found) {
    const [label, cmd] = state.claude.installHint.split(/:\s+/);
    b.innerHTML = `<b>Claude Code isn't installed on this computer.</b> MultiClaude runs it for you. ${esc(label)}: <code>${esc(cmd.trim())}</code>. Then click <a href="#" id="recheck" style="color:var(--accent)">check again</a>.`;
    b.hidden = false;
    $('#recheck').onclick = (e) => { e.preventDefault(); refresh(); };
  } else if (!state.accounts.length) {
    b.innerHTML = 'Add your Claude accounts to get started: <a href="#" id="openAccts" style="color:var(--accent)">open Accounts</a>.';
    b.hidden = false;
    $('#openAccts').onclick = (e) => { e.preventDefault(); openSettings('accounts'); };
  } else b.hidden = true;
}

/* ---------- sidebar ---------- */
const collapsedSubs = new Set(store.get('collapsedSubs', []));
function renderSidebar() {
  const q = $('#search').value.toLowerCase();
  const list = state.sessions.filter((s) => !q || s.title.toLowerCase().includes(q) || s.cwd.toLowerCase().includes(q));
  $('#recents').innerHTML = list.map((s) => {
    const subs = s.subagents || [];
    const open = subs.length && !collapsedSubs.has(s.id);
    const running = subs.filter((x) => x.status === 'running').length;
    return `
    <div class="recent ${s.id === currentId && !currentSub ? 'on' : ''}" data-id="${esc(s.id)}" title="${esc(s.cwd)}">
      <span class="dot ${s.busy ? 'busy' : ''}"></span><span class="t">${esc(s.title)}</span>
      ${subs.length ? `<button class="twist ${open ? 'open' : ''}" data-twist="${esc(s.id)}" title="${subs.length} subagent conversation${subs.length === 1 ? '' : 's'}">${running ? `<span class="count busy">${running}</span>` : `<span class="count">${subs.length}</span>`}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg></button>` : ''}
      <button class="x" data-del="${esc(s.id)}" title="Delete">✕</button>
    </div>
    ${open ? `<div class="subs">${subs.map((a) => `
      <div class="sub ${s.id === currentId && currentSub === a.id ? 'on' : ''}" data-sid="${esc(s.id)}" data-sub="${esc(a.id)}" title="${esc(a.type)} · ${esc(a.status)}">
        <span class="dot ${a.status === 'running' ? 'busy' : a.status === 'failed' ? 'bad' : ''}"></span><span class="t">${esc(a.description)}</span>
        ${a.status === 'running' ? '' : `<button class="x" data-subdel="${esc(a.id)}" data-sid="${esc(s.id)}" title="Delete (click twice)">✕</button>`}
      </div>`).join('')}</div>` : ''}`;
  }).join('') || '<div class="meta" style="padding:4px 12px">No sessions yet</div>';
  const a = state.accounts.find((x) => x.active) || state.accounts[0];
  const ready = state.accounts.filter((x) => x.status === 'ready').length;
  $('#footAvatar').textContent = a ? a.name[0].toUpperCase() : '·';
  $('#footName').textContent = a ? a.name : 'No accounts';
  $('#footMeta').textContent = state.accounts.length ? `${ready} of ${state.accounts.length} accounts ready` : 'Add one to start';
}
// Subagent delete: first click arms the button, a second click within 3 seconds deletes.
async function deleteSubagent(btn) {
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed'); btn.textContent = 'Delete?';
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = '✕'; } }, 3000);
    return;
  }
  const { sid, subdel } = btn.dataset;
  try {
    await api('DELETE', `/api/sessions/${sid}/subagents/${encodeURIComponent(subdel)}`);
    if (currentId === sid && currentSub === subdel) openSession(sid);
    refresh();
  } catch (err) { alert(err.message); }
}
$('#recents').addEventListener('click', async (e) => {
  const subDel = e.target.closest('[data-subdel]');
  if (subDel) { e.stopPropagation(); deleteSubagent(subDel); return; }
  const del = e.target.closest('[data-del]');
  if (del) { e.stopPropagation(); if (confirm('Delete this session from MultiClaude? (The Claude transcript stays on disk and can be reopened with /resume.)')) { await api('DELETE', '/api/sessions/' + del.dataset.del); if (del.dataset.del === currentId) openSession(null); refresh(); } return; }
  const twist = e.target.closest('[data-twist]');
  if (twist) {
    e.stopPropagation();
    const id = twist.dataset.twist;
    if (collapsedSubs.has(id)) collapsedSubs.delete(id); else collapsedSubs.add(id);
    store.set('collapsedSubs', [...collapsedSubs]);
    renderSidebar();
    return;
  }
  const sub = e.target.closest('.sub');
  if (sub) { openSession(sub.dataset.sid, sub.dataset.sub); $('#app').classList.remove('mobile-open'); return; }
  const row = e.target.closest('.recent'); if (row) openSession(row.dataset.id);
  $('#app').classList.remove('mobile-open');
});
$('#search').addEventListener('input', renderSidebar);
$('#toggleSide').addEventListener('click', () => {
  if (matchMedia('(max-width: 760px)').matches) $('#app').classList.toggle('mobile-open');
  else { $('#app').classList.toggle('collapsed'); store.set('collapsed', $('#app').classList.contains('collapsed')); }
});
if (store.get('collapsed', false)) $('#app').classList.add('collapsed');

function currentSubagent() {
  const s = state?.sessions.find((x) => x.id === currentId);
  return s && currentSub ? (s.subagents || []).find((a) => a.id === currentSub) : null;
}
function renderTop() {
  const s = state?.sessions.find((x) => x.id === currentId);
  const a = currentSubagent();
  $('#title').textContent = s ? s.title : 'New session';
  $('#cwdChip').hidden = !s; if (s) { $('#cwdChip').textContent = s.cwd; $('#cwdChip').title = s.cwd; }
  $('#delBtn').hidden = !s || Boolean(currentSub);
  const bar = $('#subbar');
  bar.hidden = !currentSub;
  if (currentSub) {
    bar.innerHTML = `<button class="btn" id="subBack">← Main conversation</button>
      <div class="subtitle"><b>${esc(a?.description || 'Subagent')}</b><span class="meta">${esc(a?.type || '')} · ${esc(a?.status || 'deleted')}</span></div>
      ${a && a.status !== 'running' ? `<button class="btn" id="subSave" title="Save this subagent's report to long-term memory">Save to memory</button><button class="btn" id="subDel">Delete</button>` : ''}`;
    $('#subBack').onclick = () => openSession(currentId);
    if ($('#subSave')) $('#subSave').onclick = async () => { try { await api('POST', `/api/sessions/${currentId}/subagents/${currentSub}/remember`); $('#subSave').textContent = 'Saved ✓'; } catch (err) { alert(err.message); } };
    if ($('#subDel')) $('#subDel').onclick = async () => { if (!confirm('Delete this subagent conversation? Claude will not be able to resume it.')) return; try { await api('DELETE', `/api/sessions/${currentId}/subagents/${currentSub}`); openSession(currentId); refresh(); } catch (err) { alert(err.message); } };
  }
  promptEl.placeholder = currentSub ? 'Message this subagent (sent through the main agent)…' : busy ? 'Send a message while Claude works… (Esc to stop)' : 'Ask Claude to build, fix or explain anything… (/ for commands)';
  const perm = $('#permSel').value;
  $('#hint').textContent = perm === 'bypassPermissions' ? 'Bypass permissions: Claude can run any command without asking.'
    : perm === 'plan' ? 'Plan mode: Claude plans and reads but does not change anything.'
    : 'Claude asks before running commands or editing files outside its permissions.';
}
$('#title').addEventListener('click', async () => {
  if (!currentId) return;
  const t = prompt('Rename session', $('#title').textContent);
  if (t?.trim()) { await api('PATCH', '/api/sessions/' + currentId, { title: t }); refresh(); }
});
$('#delBtn').addEventListener('click', async () => {
  if (!currentId || !confirm('Delete this session?')) return;
  await api('DELETE', '/api/sessions/' + currentId); openSession(null); refresh();
});

/* ---------- chat rendering ---------- */
let textEl = null, textBuf = '', rafPending = false;
const toolCards = new Map();
const permCards = new Map();
let workingEl = null;

function emptyState() {
  chat.innerHTML = `<div class="empty"><h2>What are we working on?</h2><p>${state?.accounts.length ? `Working in <code>${esc(state.defaultCwd)}</code>. Use <b>New session</b> to pick another folder, or type <code>/resume</code> to continue a Claude Code conversation.` : 'Add your accounts first: open <b>Accounts</b> in the sidebar.'}</p></div>`;
}
function append(el) { if (workingEl) chat.insertBefore(el, workingEl); else chat.appendChild(el); toBottom(); return el; }
function renderWorking() {
  const show = busy || bgTasks > 0;
  if (show && !workingEl) {
    workingEl = document.createElement('div'); workingEl.className = 'working';
    workingEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 6l-4.2 5 6.2 1-6.2 1.8L20 18l-6.2-2.2L12 22l-1.8-6.2L4 18l4.2-4.2L2 12l6.2-1L4 6l6.2 2.2z"/></svg><span></span>';
    chat.appendChild(workingEl); toBottom();
  } else if (!show && workingEl) { workingEl.remove(); workingEl = null; }
  if (workingEl) {
    $('span', workingEl).textContent = busy
      ? `Working…${bgTasks ? ` · ${bgTasks} background task${bgTasks === 1 ? '' : 's'}` : ''}${currentSub ? '' : ' (Esc to stop)'}`
      : `${bgTasks} background task${bgTasks === 1 ? '' : 's'} running`;
    workingEl.classList.toggle('idle', !busy);
  }
}
function setWorking(on) {
  busy = on;
  renderWorking();
  syncSendButton();
  if (!on) setStatus('');
  renderTop();
}
function syncSendButton() {
  const b = $('#sendBtn');
  const stopMode = busy && !promptEl.value.trim() && !currentSub;
  b.classList.toggle('stop', stopMode);
  b.title = stopMode ? 'Stop (Esc)' : 'Send';
  b.innerHTML = stopMode ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
}
function setStatus(text) { $('#status').style.display = text ? 'block' : 'none'; $('#status').textContent = text; }

function flushText() { rafPending = false; if (textEl) { textEl.innerHTML = markdown(textBuf); toBottom(); } }
function addText(t, isBlock) {
  if (!textEl) { textEl = append(document.createElement('div')); textEl.className = 'md'; textBuf = ''; }
  textBuf += t;
  if (!rafPending) { rafPending = true; requestAnimationFrame(flushText); }
  if (isBlock) { flushText(); textEl = null; }
}
function endText() { if (textEl) flushText(); textEl = null; }

const short = (p) => { const s = String(p || ''); const parts = s.split(/[\\/]/); return parts.length > 3 ? '…/' + parts.slice(-3).join('/') : s; };
function toolArg(name, i = {}) {
  if (name === 'Bash' || name === 'PowerShell') return i.command;
  if (['Read', 'Write', 'Edit', 'MultiEdit', 'NotebookEdit'].includes(name)) return short(i.file_path || i.notebook_path);
  if (name === 'Grep' || name === 'Glob') return i.pattern + (i.path ? `  in ${short(i.path)}` : '');
  if (name === 'WebFetch') return i.url;
  if (name === 'WebSearch') return i.query;
  if (name === 'Task' || name === 'Agent') return (i.subagent_type ? `${i.subagent_type}: ` : '') + (i.description || '');
  if (name === 'SendMessage') return `→ ${i.to || ''}: ${i.message || ''}`;
  if (name === 'TodoWrite') return `${(i.todos || []).filter((t) => t.status === 'completed').length}/${(i.todos || []).length} done`;
  const first = Object.values(i).find((v) => typeof v === 'string');
  return first || '';
}
function toolBody(name, i = {}) {
  if (name === 'Edit' || name === 'MultiEdit') {
    const edits = name === 'Edit' ? [i] : (i.edits || []);
    return `<div class="diff">${edits.map((e) => [
      ...String(e.old_string ?? '').split('\n').map((l) => `<div class="d">- ${esc(l)}</div>`),
      ...String(e.new_string ?? '').split('\n').map((l) => `<div class="a">+ ${esc(l)}</div>`),
    ].join('')).join('<div>⋯</div>')}</div>`;
  }
  if (name === 'Write') return `<div class="diff">${String(i.content ?? '').split('\n').slice(0, 400).map((l) => `<div class="a">+ ${esc(l)}</div>`).join('')}</div>`;
  if (name === 'TodoWrite') {
    return `<ul class="todos">${(i.todos || []).map((t) => `<li class="${t.status === 'completed' ? 'done' : t.status === 'in_progress' ? 'doing' : ''}">${t.status === 'completed' ? '☑' : t.status === 'in_progress' ? '◐' : '☐'} ${esc(t.content)}</li>`).join('')}</ul>`;
  }
  if (name === 'Task' || name === 'Agent') return i.prompt ? `<pre class="out">${esc(i.prompt)}</pre>` : '';
  if ((name === 'Bash' || name === 'PowerShell') && i.command && i.command.includes('\n')) return `<pre class="out">$ ${esc(i.command)}</pre>`;
  return '';
}
function addTool(ev) {
  endText();
  const isAgent = ev.name === 'Task' || ev.name === 'Agent';
  const el = document.createElement('div');
  el.className = `tool running${isAgent ? ' agent' : ''}${ev.name === 'TodoWrite' ? ' open' : ''}`;
  el.innerHTML = `<div class="head"><span class="st"></span><span class="name">${esc(isAgent ? 'Subagent' : ev.name)}</span><span class="arg">${esc(toolArg(ev.name, ev.input))}</span>${isAgent && !currentSub ? `<button class="btn open-sub" data-open-sub="${esc(ev.id)}">Open</button>` : ''}<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="body">${toolBody(ev.name, ev.input)}</div>`;
  $('.head', el).addEventListener('click', (e) => {
    const openBtn = e.target.closest('[data-open-sub]');
    if (openBtn) { e.stopPropagation(); openSession(currentId, openBtn.dataset.openSub); return; }
    el.classList.toggle('open');
  });
  append(el);
  if (ev.id) toolCards.set(ev.id, el);
  if (isAgent) syncAgentCard(ev.id);
}
function syncAgentCard(id) {
  const el = toolCards.get(id);
  const a = state?.sessions.find((x) => x.id === currentId)?.subagents?.find((x) => x.id === id);
  if (!el || !a) return;
  el.classList.toggle('running', a.status === 'running');
  el.classList.toggle('ok', a.status === 'done');
  el.classList.toggle('err', a.status === 'failed' || a.status === 'stopped');
}
function addResult(ev) {
  const el = toolCards.get(ev.toolUseId);
  if (!el) return;
  if (el.classList.contains('agent')) {
    // An async subagent reports "launched" first; its real report arrives later.
    if (/agent launched/i.test(ev.content || '')) return;
    el.classList.remove('running'); el.classList.add(ev.isError ? 'err' : 'ok');
    if (ev.content) { const md = document.createElement('div'); md.className = 'md'; md.style.padding = '4px 12px'; md.innerHTML = markdown(ev.content); $('.body', el).appendChild(md); }
    return;
  }
  el.classList.remove('running');
  el.classList.add(ev.isError ? 'err' : 'ok');
  if (ev.content && !['Edit', 'MultiEdit', 'Write', 'TodoWrite'].includes($('.name', el).textContent) || ev.isError) {
    const pre = document.createElement('pre'); pre.className = 'out'; pre.textContent = ev.content || '(no output)';
    $('.body', el).appendChild(pre);
  }
  if (ev.isError) el.classList.add('open');
}
function addPermission(ev) {
  endText();
  if (permCards.has(ev.requestId)) return;
  const el = document.createElement('div');
  el.className = 'perm';
  const what = toolArg(ev.toolName, ev.input || {});
  const always = (ev.suggestions || []).length;
  el.innerHTML = `<div class="q">Claude wants to use <b>${esc(ev.displayName || ev.toolName)}</b>${what ? `: <code>${esc(String(what).slice(0, 200))}</code>` : ''}</div>
    ${ev.description && ev.description !== what ? `<div class="meta">${esc(ev.description)}</div>` : ''}
    ${toolBody(ev.toolName, ev.input || {})}
    <div class="acts"><button class="btn primary" data-d="allow">Allow</button>${always ? '<button class="btn" data-d="always">Allow for this session</button>' : ''}<button class="btn" data-d="deny">Deny</button></div>`;
  el.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    el.querySelectorAll('button').forEach((x) => { x.disabled = true; });
    try { await api('POST', `/api/sessions/${currentId}/permissions/${ev.requestId}`, { decision: b.dataset.d }); }
    catch (err) { errorLine(err.message); el.querySelectorAll('button').forEach((x) => { x.disabled = false; }); }
  });
  permCards.set(ev.requestId, el);
  append(el);
  toBottom(true);
}
function resolvePermission(ev) {
  const el = permCards.get(ev.requestId);
  if (!el) return;
  const label = { allow: 'Allowed', always: 'Allowed for this session', deny: 'Denied', cancelled: 'Cancelled' }[ev.decision] || ev.decision;
  $('.acts', el).innerHTML = `<span class="meta">${esc(label)}</span>`;
  el.classList.add('answered');
}
function note(text) { endText(); const d = document.createElement('div'); d.className = 'note'; d.textContent = text; append(d); }
function errorLine(text) { endText(); const d = document.createElement('div'); d.className = 'error'; d.textContent = text; append(d); }

function handle(ev) {
  const notify = state?.settings.notifySwitches;
  switch (ev.type) {
    case 'user': {
      endText();
      const d = document.createElement('div'); d.className = 'msg-user';
      d.innerHTML = `<div>${esc(ev.text)}</div>${ev.midTurn ? '<span class="meta">sent while Claude was working</span>' : ''}`;
      append(d); toBottom(true); break;
    }
    case 'text': addText(ev.text, ev.block); break;
    case 'text_end': endText(); break;
    case 'tool': addTool(ev); break;
    case 'tool_result': addResult(ev); break;
    case 'permission': addPermission(ev); break;
    case 'permission_done': resolvePermission(ev); break;
    case 'compact': note(ev.trigger === 'manual' ? 'Conversation compacted' : 'Conversation compacted automatically to free up context'); break;
    case 'tasks': bgTasks = ev.running || 0; renderWorking(); break;
    case 'subagent':
      if (!ev.replay) {
        const s = state?.sessions.find((x) => x.id === currentId);
        if (s) {
          s.subagents = s.subagents || [];
          const i = s.subagents.findIndex((x) => x.id === ev.subagent.id);
          if (i >= 0) s.subagents[i] = ev.subagent; else s.subagents.push(ev.subagent);
          renderSidebar(); syncAgentCard(ev.subagent.id);
          if (currentSub === ev.subagent.id) { renderTop(); setWorking(ev.subagent.status === 'running'); }
        }
      }
      break;
    case 'subagent_deleted': if (!ev.replay) refresh(); break;
    case 'busy': if (!currentSub) setWorking(ev.busy); break;
    case 'ready':
      if (currentSub) setWorking(Boolean(ev.busy));
      else {
        setWorking(ev.busy);
        for (const a of ev.subagents || []) syncAgentCard(a.id);
      }
      break;
    case 'done':
      endText();
      if (!ev.replay && !currentSub) { refresh(); }
      if (ev.aborted) note('Interrupted');
      if (ev.error) errorLine(ev.error);
      break;
    case 'waiting':
      clearInterval(waitTimer);
      { const tick = () => setStatus(`Every account is at its usage limit. Continuing automatically in ${dur(ev.until - Date.now())} (${new Date(ev.until).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}).`); tick(); waitTimer = setInterval(tick, 1000); }
      break;
    case 'account': if (!ev.replay) refresh(); if (notify) note(`Using ${ev.account.name}`); break;
    case 'switch': if (notify) note(`Switched to ${ev.to.name}`); break;
    case 'limited': if (!ev.replay) refresh(); if (notify) note(`${ev.account.name} reached its limit · resets ${new Date(ev.until).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`); break;
    case 'retry': if (notify) note(`API busy, retrying in ${dur(ev.delayMs)}`); break;
    case 'notice': if (!ev.replay) refresh(); if (notify) errorLine(ev.message); break;
  }
  if (ev.type !== 'waiting' && ev.type !== 'text' && waitTimer) { clearInterval(waitTimer); waitTimer = null; setStatus(''); }
}

function openSession(id, sub = null) {
  es?.close(); es = null;
  currentId = id; currentSub = sub; store.set('session', id);
  chat.innerHTML = ''; textEl = null; toolCards.clear(); permCards.clear(); workingEl = null; bgTasks = 0; setWorking(false);
  clearInterval(waitTimer); waitTimer = null; setStatus('');
  if (state) { renderSidebar(); renderTop(); }
  if (!id) { emptyState(); return; }
  stick = true;
  const url = sub ? `/api/sessions/${id}/subagents/${encodeURIComponent(sub)}/events` : `/api/sessions/${id}/events`;
  const mine = new EventSource(`${url}?token=${encodeURIComponent(token)}`);
  es = mine;
  mine.onmessage = (e) => { if (es === mine) handle(JSON.parse(e.data)); };
  mine.onerror = () => { if (es === mine && mine.readyState === EventSource.CLOSED) setTimeout(() => es === mine && openSession(id, sub), 2000); };
}

/* slash commands */
const SLASH = [
  ['/resume', 'Continue a previous Claude Code conversation'],
  ['/compact', 'Summarise the conversation to free up context'],
  ['/clear', 'Start a new session in the same folder'],
  ['/model', 'Switch model: /model opus'],
  ['/effort', 'Set effort: /effort high'],
  ['/stop', 'Stop what Claude is doing'],
  ['/memory', 'Open long-term memory'],
];
let slashIndex = 0;
function slashMatches() {
  const v = promptEl.value;
  if (!v.startsWith('/') || v.includes('\n') || v.includes(' ')) return [];
  return SLASH.filter(([c]) => c.startsWith(v.toLowerCase()));
}
function renderSlashMenu() {
  const m = slashMatches();
  const menu = $('#slashMenu');
  menu.hidden = !m.length;
  if (!m.length) return;
  slashIndex = Math.min(slashIndex, m.length - 1);
  menu.innerHTML = m.map(([c, d], i) => `<div class="${i === slashIndex ? 'on' : ''}" data-cmd="${c}"><b>${c}</b><span>${esc(d)}</span></div>`).join('');
}
function slashMenuKey(e) {
  const m = slashMatches();
  if (!m.length) return false;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); slashIndex = (slashIndex + (e.key === 'ArrowDown' ? 1 : m.length - 1)) % m.length; renderSlashMenu(); return true; }
  if (e.key === 'Tab' || (e.key === 'Enter' && m[slashIndex][0] !== promptEl.value.trim())) {
    e.preventDefault(); promptEl.value = m[slashIndex][0] + (['/model', '/effort'].includes(m[slashIndex][0]) ? ' ' : ''); renderSlashMenu(); return true;
  }
  if (e.key === 'Escape') { e.preventDefault(); promptEl.value = ''; renderSlashMenu(); return true; }
  return false;
}
$('#slashMenu').addEventListener('mousedown', (e) => {
  const d = e.target.closest('[data-cmd]'); if (!d) return;
  e.preventDefault(); promptEl.value = d.dataset.cmd; renderSlashMenu(); $('#composer').requestSubmit();
});

/** Handle commands MultiClaude implements itself; returns true if handled. */
async function localCommand(text) {
  const [cmd, ...rest] = text.split(/\s+/);
  const arg = rest.join(' ').trim();
  switch (cmd.toLowerCase()) {
    case '/resume': openResume(arg); return true;
    case '/clear': case '/new': {
      const cur = state?.sessions.find((s) => s.id === currentId);
      const s = await api('POST', '/api/sessions', { cwd: cur?.cwd || state.defaultCwd });
      await refresh(); openSession(s.id); return true;
    }
    case '/model': {
      const opt = [...$('#modelSel').options].find((o) => o.value === arg.toLowerCase() || o.textContent.toLowerCase() === arg.toLowerCase());
      if (!opt && arg) { const o = new Option(arg, arg); $('#modelSel').add(o); }
      $('#modelSel').value = opt ? opt.value : arg; store.set('model', $('#modelSel').value); note(`Model: ${$('#modelSel').selectedOptions[0]?.textContent || 'default'}`); return true;
    }
    case '/effort': {
      if (![...$('#effortSel').options].some((o) => o.value === arg)) { errorLine('Effort: low, medium, high, xhigh or max'); return true; }
      $('#effortSel').value = arg; store.set('effort', arg); note(`Effort: ${arg}`); return true;
    }
    case '/stop': stop(); return true;
    case '/memory': openSettings('memory'); return true;
    default: return false;
  }
}

$('#composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = promptEl.value.trim();
  if (!text) { if (busy) stop(); return; }
  if (!state?.accounts.length) { openSettings('accounts'); return; }
  $('#slashMenu').hidden = true;
  try {
    if (text.startsWith('/') && await localCommand(text)) { promptEl.value = ''; grow(); syncSendButton(); return; }
    let message = text;
    if (currentSub) {
      // Subagents are driven by the main agent, so relay the message through it.
      const a = currentSubagent();
      message = `Please send this message to the subagent "${a?.description || currentSub}"${a?.agentId ? ` (agentId ${a.agentId})` : ''} using SendMessage, and continue from its reply:\n\n${text}`;
      openSession(currentId);
    }
    if (!currentId) { const s = await api('POST', '/api/sessions', { cwd: state.defaultCwd }); openSession(s.id); }
    promptEl.value = ''; grow(); syncSendButton();
    await api('POST', `/api/sessions/${currentId}/messages`, { prompt: message, model: $('#modelSel').value, effort: $('#effortSel').value, permissionMode: $('#permSel').value });
    refresh();
  } catch (err) { errorLine(err.message); }
});

}
const ago = (t) => { const s = (Date.now() - t) / 1000; return s < 3600 ? `${Math.max(1, Math.round(s / 60))}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`; };
function renderResume() {
  const q = $('#resumeSearch').value.toLowerCase();
  const list = conversations.filter((c) => !q || c.title.toLowerCase().includes(q) || c.firstPrompt.toLowerCase().includes(q) || (c.cwd || '').toLowerCase().includes(q));
  $('#resumeList').innerHTML = list.map((c) => `
    <div class="conv" data-conv="${esc(c.id)}">
      <div class="t">${esc(c.title)}</div>
      <div class="meta">${ago(c.updatedAt)} · ${c.messages} message${c.messages === 1 ? '' : 's'} · ${esc(c.cwd || 'unknown folder')}${c.sessionId ? ' · open in MultiClaude' : ''}</div>
    </div>`).join('') || '<div class="meta" style="padding:10px">No conversations found.</div>';
}
$('#resumeSearch').addEventListener('input', renderResume);
$('#resumeList').addEventListener('click', async (e) => {

});

$('#rotForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target;
  const data = Object.fromEntries(new FormData(f)); data.notifySwitches = f.elements.notifySwitches.checked;
  try { state = await api('POST', '/api/settings', data); renderSettings(); f.closest('.modal').classList.remove('on'); } catch (err) { alert(err.message); }
});
$('#memSave').addEventListener('click', async () => {
  try { await api('POST', '/api/memory', { text: $('#memText').value }); $('#memSaved').textContent = 'Saved'; setTimeout(() => { $('#memSaved').textContent = ''; }, 1500); }
  catch (err) { alert(err.message); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal.on').forEach((m) => m.classList.remove('on')); });

/* ---------- boot ---------- */
(async () => {
  await refresh();
  if (!state) return;
  if (currentId && !state.sessions.some((s) => s.id === currentId)) currentId = null;
  openSession(currentId);
  const g = new EventSource('/api/events?token=' + encodeURIComponent(token));
  let pending = null;
  g.onmessage = (e) => { if (JSON.parse(e.data).type === 'changed') { clearTimeout(pending); pending = setTimeout(refresh, 150); } };
  setInterval(refresh, 30000);
  promptEl.focus();
})();
</script>
</body>
</html>
