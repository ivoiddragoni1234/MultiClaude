name: Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:exe

      - name: Smoke test MultiClaude.exe
        shell: pwsh
        run: |
          $env:MULTICLAUDE_HOME = Join-Path $env:RUNNER_TEMP 'mc'
          $proc = Start-Process -FilePath dist\MultiClaude.exe -PassThru
          $state = $null
          for ($i = 0; $i -lt 40 -and -not $state; $i++) {
            Start-Sleep -Seconds 1
            $tokenFile = Join-Path $env:MULTICLAUDE_HOME 'app-token'
            if (Test-Path $tokenFile) {
              try { $state = Invoke-RestMethod http://127.0.0.1:7878/api/state -Headers @{ 'x-token' = (Get-Content $tokenFile -Raw).Trim() } } catch {}
            }
          }
          Get-Content (Join-Path $env:MULTICLAUDE_HOME 'logs\app.log') -ErrorAction SilentlyContinue
          if (-not $state) { throw 'MultiClaude.exe did not start its server' }
          $html = Invoke-WebRequest http://127.0.0.1:7878/ -UseBasicParsing
          if ($html.Content -notmatch '<title>MultiClaude</title>') { throw 'UI page missing' }
          # account profiles must get their shared folders linked on Windows
          $acct = Invoke-RestMethod -Method Post http://127.0.0.1:7878/api/accounts -ContentType 'application/json' `
            -Headers @{ 'x-token' = (Get-Content (Join-Path $env:MULTICLAUDE_HOME 'app-token') -Raw).Trim() } `
            -Body '{"name":"ci","type":"api","secret":"sk-test"}'
          Get-ChildItem (Join-Path $env:MULTICLAUDE_HOME "accounts\$($acct.id)") | Format-Table Name, LinkType, Target
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          "OK: server up, platform=$($state.platform)"

      - uses: actions/upload-artifact@v4
        with:
          name: MultiClaude-windows
          path: dist/MultiClaude.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MultiClaude.exe
